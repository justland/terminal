ignores:
  - '@repobuddy/typescript' # referenced by tsconfig, which depcheck does not read
  - '@size-limit/*' # depcheck doesn't recognize size-limit plugins
  - '@types/*'
  - '@vitest/coverage-v8' # loaded by vitest, never imported
  - npm-run-all2 # provides run-s for the `nuke` script
  - rimraf # used by the `clean` script, which depcheck does not read
