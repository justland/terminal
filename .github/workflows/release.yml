name: release
on:
  push:
    branches: [main]

jobs:
  code:
    uses: justland/.github/.github/workflows/pnpm-verify.yml@v1

  # Secretless: GITHUB_TOKEN opens the version PR, npm trusted publishing (OIDC)
  # does the publish. Nothing here to rotate or silently expire.
  #
  # The repo's default workflow token is `read`, so this block is not optional —
  # the callee declares id-token/contents/pull-requests and a callee can only
  # narrow what the caller grants. Drop it and the run fails at resolution with
  # no jobs and no logs.
  release:
    uses: justland/.github/.github/workflows/pnpm-release-changeset-oidc.yml@v1
    needs: code
    permissions:
      id-token: write
      contents: write
      pull-requests: write
