name: pull-request
on:
  pull_request:
    types: [opened, synchronize]
  # The merge queue builds a temporary merge-group branch and looks for the required
  # `code / all-checks` context there. It fires neither `pull_request` nor `push`, so
  # without this trigger the queue waits forever on a check that never starts.
  merge_group:

jobs:
  code:
    uses: justland/.github/.github/workflows/pnpm-verify.yml@v1
